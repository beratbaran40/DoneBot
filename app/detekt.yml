config:
  validation: true
  warningsAsErrors: false
  excludes: ''

complexity:
  LongMethod:
    active: true
    threshold: 120
    ignoreAnnotated:
      - Composable
  TooManyFunctions:
    active: true
    thresholdInClasses: 40
    thresholdInInterfaces: 40
    thresholdInObjects: 40
    ignoreAnnotated:
      - HiltViewModel
    ignorePrivate: true
  CyclomaticComplexMethod:
    active: true
    threshold: 20
    ignoreSingleWhenExpression: true
  LongParameterList:
    active: true
    functionThreshold: 10
    constructorThreshold: 12
    ignoreAnnotated:
      - Composable
      - HiltViewModel
  NestedBlockDepth:
    active: true
    threshold: 6


exceptions:
  InstanceOfCheckForException:
    active: false
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false
  PrintStackTrace:
    active: false
potential-bugs:
  # Off because it is wrong here, not because it is inconvenient. detekt 1.23.4 still analyses with
  # the K1 frontend while this project compiles on Kotlin 2.2.21, so its binding context cannot type
  # a property read that goes through a getter or a delegate. `audioManager ?: return false`
  # (a `by lazy`) and `task.startDate ?: return@runCatching` (an extension property) both get read as
  # "elvis always taken", which marks the rest of the function unreachable — 14 findings on code that
  # compiles and runs correctly. A plain backing-field `var` in the same file is NOT flagged, which is
  # the tell. Nothing is lost by turning it off: kotlinc emits its own UNREACHABLE_CODE warning for
  # genuinely dead code. Re-enable when detekt moves to the K2 frontend (2.x).
  UnreachableCode:
    active: false
naming:
  ClassNaming:
    excludes: &testFolders
      - '**/test/**'
      - '**/androidTest/**'
  ConstructorParameterNaming:
    excludes: *testFolders
  FunctionNaming:
    ignoreAnnotated:
      [ 'Composable' ]
    active: true
    excludes: [ '**/jvmTest/**', '**/test/**', '**/androidTest/**', '**/commonTest/**' ]
    functionPattern: '[a-z][a-zA-Z0-9]*'
    excludeClassPattern: '$^'
style:
  UnusedPrivateMember:
    active: true
    ignoreAnnotated:
      - Preview
      - PreviewLightDark
      - TDPreviewForm
      - TDPreviewDialog
      - TDPreviewWide
      - TDPreviewNoBg
      - TDPreview
      - Composable
  MagicNumber:
    active: false
  ReturnCount:
    active: true
    max: 5
  MaxLineLength:
    active: false
  UnusedParameter:
    active: false
formatting:
  active: true
  NoUnusedImports:
    active: true
  Indentation:
    active: false
  MaximumLineLength:
    active: false
  Wrapping:
    active: false
  ArgumentListWrapping:
    active: false
  ParameterListWrapping:
    active: false
  MultiLineIfElse:
    active: false
