# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2048m
# Parallel module compilation (safe with the :app/:uikit decoupled layout).
org.gradle.parallel=true
# Local Gradle build cache — speeds up incremental builds and CI re-runs.
org.gradle.caching=true
# Configuration cache — caches the configuration phase task graph. If a future
# plugin breaks compatibility, comment this out and file an issue with the plugin.
org.gradle.configuration-cache=true
# Kotlin incremental compilation (default true on modern Gradle, set explicit for clarity).
kotlin.incremental=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true

# Gradle requires JDK/JBR 21. JDK 24 fails with "Type T not present".
# Pinned so a plain shell, CI and automated agents all resolve the same runtime that
# Android Studio uses — the shell's own `java` is 24 on this machine. Bytecode target
# stays Java 17. Not quoted and not escaped: a Java properties value runs to end of
# line, so quoting the space in "Android Studio Panda.app" breaks the lookup.
# If an Android Studio update renames the app bundle, re-discover with:
#   ls -d /Applications/Android\ Studio*.app/Contents/jbr/Contents/Home
org.gradle.java.home=/Applications/Android Studio Panda.app/Contents/jbr/Contents/Home
